# BLAST-RADIUS TIERS — THE RECORD. Hand-authored; a why on every line. Every line is a GRANT
# the engine honours, and tests/test_tiers_harvest.py guards each one: a live mutating address,
# a tier in the vocabulary, a justification that is never blank, 147 family lines, no line that
# claims recoverable while its own sentence says permanent, and the exact count (a grant added
# or withdrawn moves the pin on purpose). Editing this file IS the act of granting.
#
# Until 2026-09-23 a generator (scripts/harvest_tiers.py) wrote this file from the thin
# mutation wrappers' own plan functions, reading each blast sentence whole from the syntax tree.
# Those wrappers are gone (bucket B: the door serves their addresses), so the generator lost
# its source and was retired in the same commit, after one last run reproduced these bytes
# exactly. The sentences below are those wrappers' judgements, carried here verbatim.
#
# ── RATIFIED 2026-09-22 (Claude, under John's "own as you go"; his to overrule) ─────────────
# The RISK->tier mapping below is adopted as the one that carries each wrapper's own written
# blast-radius judgement into the vocabulary the engine reads, with the round-3 correction
# that the sentence wins over the label when it says permanent. SEVERITY DOES NOT GATE:
# presence is the whole permission, and whether "destructive" should ever require more than
# "read-back" is John's decision by name, not this file's.
#
# ── SEVERITY IS A LABEL. PRESENCE IS THE PERMISSION. ───────────────────────────────────────
# `govern()` asks only whether a tier is in the vocabulary. "read-back" and "destructive" are
# equally permissive. A tier does not restrain an address, it OPENS it to an armed operator.
# So every line below is a GRANT, and the sentence after it is the reason to make that grant.
#
# An earlier hand-written draft tiered FAMILIES and got two of fifteen lines wrong: a line
# meaning "a remote registration is re-addable" in fact covered 25 cross-cluster guest
# stop/start/migrate operations against a second live Proxmox. From 2026-09-22 this file
# carried ADDRESSES ONLY. On 2026-09-26 John ruled the other grain: "family grain, go with 87".
# The 87 families the proof measured are tiered under [tier.family] at the end, one sentence
# each; the address lines stay, and ADDRESS BEATS FAMILY. Judge the sentence, not the path.
# On 2026-10-04 (John: "every gate offered") the 60 families the harvest never reached, 116
# addresses the engine had refused as unjudged (node reboot on three planes, datacenter options,
# cluster create and join, most of PDM), got their sentences from the vendor's own published
# descriptions, and the 20 addresses the door refuses on purpose moved to [tier.held] below.
#
# ── PROVENANCE AND ITS ONE ASSUMPTION ──────────────────────────────────────────────────────
# Harvested (once) from plan functions carrying `planning.RISK_*` + `blast_radius`. The mapping
#     RISK_HIGH -> destructive   RISK_MEDIUM -> disruptive
#     RISK_LOW  -> restorable    RISK_NONE   -> read-back
# is a CHOICE, not a harvest: the two vocabularies are different axes that share an arity.
# It is ratified above; the sentence beside each line is what an operator reads at plan time.
#
# The join REFUSED AMBIGUITY: a tool naming zero or two-plus mutating addresses, or a plan that
# branched into two judgements, was left out rather than guessed; those addresses are refused
# even when armed until a hand writes their line here.
# `python scripts/tier_preview.py records/tiers.toml` shows the grant as the engine reads it.

[tier]
"pbs:DELETE /config/access/ad/{realm}" = { tier = "destructive", why = "PERMANENTLY removes AD realm {realm!r} — no undo | any users who authenticate via {realm!r} can no longer log in | Smoke-confirm: whether PBS user records under this realm's namespace (userid ending '@{realm}') are also removed or left orphaned [pbs_realm_ad_delete, RISK_MEDIUM]" }
"pbs:DELETE /config/access/ldap/{realm}" = { tier = "destructive", why = "PERMANENTLY removes LDAP realm {realm!r} — no undo | any users who authenticate via {realm!r} can no longer log in | Smoke-confirm: whether PBS user records under this realm's namespace (userid ending '@{realm}') are also removed or left orphaned [pbs_realm_ldap_delete, RISK_MEDIUM]" }
"pbs:DELETE /config/access/openid/{realm}" = { tier = "destructive", why = "PERMANENTLY removes OpenID realm {realm!r} — no undo | any users who authenticate via {realm!r} can no longer log in | Smoke-confirm: whether PBS user records under this realm's namespace (userid ending '@{realm}') are also removed or left orphaned [pbs_realm_openid_delete, RISK_MEDIUM]" }
"pbs:DELETE /config/changer/{name}" = { tier = "restorable", why = "removes tape changer {name!r}'s config — drives associated with this changer fail to load/unload until it is re-created; the tape hardware itself and any data on tape are untouched [pbs_tape_changer_delete, RISK_LOW]" }
"pbs:DELETE /config/drive/{name}" = { tier = "restorable", why = "removes tape drive {name!r}'s config — tape-backup jobs referencing this drive fail until it is re-created; the tape hardware itself and any data on tape are untouched [pbs_tape_drive_delete, RISK_LOW]" }
"pbs:DELETE /config/encryption-keys/{id}" = { tier = "destructive", why = "removes encryption key {key_id!r}'s registration from PBS. PBS's OWN description here is bare ('Remove encryption key.') — it does NOT state that encrypted content becomes unreadable (unlike the tape-encryption-keys plane, which says so explicitly). INFERRED, not schema-verified: if this was the only tracked copy of the key material, content encrypted with it may become unrecoverable via tooling that looks the key up by this id — Smoke-confirm before treating this as PBS-confirmed the way tape's warning is. [pbs_encryption_key_delete, RISK_HIGH]" }
"pbs:DELETE /config/media-pool/{name}" = { tier = "disruptive", why = "removes media pool {name!r}'s config — tape-backup jobs referencing this pool fail until it is re-created; media/backup data already written to tapes that belonged to this pool is untouched, but the retention/allocation policy and any encryption-key association governing future writes is gone [pbs_tape_pool_delete, RISK_MEDIUM]" }
"pbs:DELETE /config/metrics/influxdb-http/{name}" = { tier = "disruptive", why = "removes InfluxDB http metrics server config {name!r} — PBS stops sending host/datastore metrics to this endpoint immediately; any stored API token is discarded from PBS's config (re-enter it if this config is re-created) [pbs_metrics_influxdb_http_delete, RISK_MEDIUM]" }
"pbs:DELETE /config/metrics/influxdb-udp/{name}" = { tier = "restorable", why = "removes InfluxDB udp metrics server config {name!r} — PBS stops sending host/datastore metrics to this endpoint immediately; no data loss (fire-and-forget UDP carried no durable state) [pbs_metrics_influxdb_udp_delete, RISK_LOW]" }
"pbs:DELETE /config/prune/{id}" = { tier = "restorable", why = "removes the PBS prune scheduled job; scheduled runs cease | existing backups, snapshots, or synced data are NOT deleted [pbs_job_delete, RISK_LOW]" }
"pbs:DELETE /config/s3/{id}" = { tier = "disruptive", why = "removes S3 client config {s3_id!r} and its stored access-key/secret-key pair — the credential entry cannot be retrieved after deletion | any datastore or sync configuration referencing this s3-endpoint-id breaks immediately [pbs_s3_client_delete, RISK_MEDIUM]" }
"pbs:DELETE /config/tape-backup-job/{id}" = { tier = "disruptive", why = "removes tape backup job {job_id!r}'s config — future automatic tape backups for this job's schedule/guest-filter STOP running, silently (no error, no alert). Media/backup data already written to tape is untouched. [pbs_tape_backup_job_delete, RISK_MEDIUM]" }
"pbs:DELETE /config/tape-encryption-keys/{fingerprint}" = { tier = "destructive", why = "PERMANENTLY removes encryption key {fingerprint!r} from PBS's database — TAPES ENCRYPTED WITH THIS KEY BECOME UNREADABLE WITHOUT IT. This is PBS's own description, verbatim: 'you can no longer access tapes using this key.' There is no undo unless the key material was separately exported/backed up outside PBS. | any media pool whose `encrypt` field still references {fingerprint!r} keeps pointing at a now-nonexistent key — future writes into that pool will fail until the pool is updated to a different key or its encrypt field is cleared [pbs_tape_key_delete, RISK_HIGH]" }
"pbs:DELETE /config/verify/{id}" = { tier = "restorable", why = "removes the PBS verify scheduled job; scheduled runs cease | existing backups, snapshots, or synced data are NOT deleted [pbs_job_delete, RISK_LOW]" }
"pbs:DELETE /nodes/{node}/certificates/custom" = { tier = "disruptive", why = "node TLS certificate: removes the custom cert — clients see a TLS warning until a new cert is uploaded [pbs_node_cert_delete, RISK_MEDIUM]" }
"pbs:DELETE /nodes/{node}/disks/directory/{name}" = { tier = "destructive", why = "directory datastore {name!r} on PBS node {node!r}: removes the mount unit and datastore config mapping — data on the underlying disk may persist but is unmanaged; PBS's own API exposes NO cleanup-disks option here (unlike PVE), so the disk is never wiped by this call [pbs_node_disk_directory_delete, RISK_HIGH]" }
"pbs:DELETE /nodes/{node}/network" = { tier = "restorable", why = "node/{node}: any un-applied pbs_node_network_iface_create/update/delete staged edits are lost [pbs_node_network_revert, RISK_LOW]" }
"pbs:DELETE /nodes/{node}/network/{iface}" = { tier = "disruptive", why = "stages removal of interface {iface!r} on {node} — NOT live until pbs_node_network_reload [pbs_node_network_iface_delete, RISK_MEDIUM]" }
"pbs:DELETE /nodes/{node}/subscription" = { tier = "disruptive", why = "node/{node} subscription record removed — entitlement/support-level state reverts to unlicensed [pbs_node_subscription_delete, RISK_MEDIUM]" }
"pbs:DELETE /nodes/{node}/tasks/{upid}" = { tier = "destructive", why = "stopping a backup/restore/verify/sync/prune/GC task mid-flight can leave the target datastore or snapshot in an inconsistent or partial state | the task may not stop immediately — PBS sends a cancellation signal, the task observes it at its next checkpoint [pbs_node_task_stop, RISK_HIGH]" }
"pbs:POST /admin/datastore/{store}/mount" = { tier = "disruptive", why = "datastore '{store}' becomes available — scheduled jobs with run-on-mount fire, and backups/syncs targeting it start succeeding again [pbs_datastore_mount, RISK_MEDIUM]" }
"pbs:POST /admin/datastore/{store}/unmount" = { tier = "disruptive", why = "datastore '{store}' becomes UNAVAILABLE — in-flight operations are aborted and every backup/sync/verify/prune job targeting it fails until re-mounted [pbs_datastore_unmount, RISK_MEDIUM]" }
"pbs:POST /admin/prune/{id}/run" = { tier = "destructive", why = "starts a prune run immediately (async task) — may consume I/O and CPU | prune runs DELETE snapshots per the retention policy — permanent, not undoable [pbs_job_run, RISK_HIGH]" }
"pbs:POST /admin/verify/{id}/run" = { tier = "restorable", why = "starts a verify run immediately (async task) — may consume I/O and CPU | verify is integrity-only — no data change [pbs_job_run, RISK_LOW]" }
"pbs:POST /config/access/ad" = { tier = "disruptive", why = "adds AD auth realm {realm!r} (server1={server1!r}) to the PBS server | a misconfigured realm can let unintended principals authenticate, or simply fail to authenticate anyone until fixed [pbs_realm_ad_create, RISK_MEDIUM]" }
"pbs:POST /config/access/ldap" = { tier = "disruptive", why = "adds LDAP auth realm {realm!r} (server1={server1!r}) to the PBS server | a misconfigured realm can let unintended principals authenticate, or simply fail to authenticate anyone until fixed [pbs_realm_ldap_create, RISK_MEDIUM]" }
"pbs:POST /config/access/openid" = { tier = "disruptive", why = "adds OpenID auth realm {realm!r} (issuer={issuer_url!r}) to the PBS server | a misconfigured realm can let unintended principals authenticate, or simply fail to authenticate anyone until fixed [pbs_realm_openid_create, RISK_MEDIUM]" }
"pbs:POST /config/changer" = { tier = "disruptive", why = "adds a new tape changer identifier {name!r} pointing at host device {path!r} — no existing drive/changer/job config is affected [pbs_tape_changer_create, RISK_MEDIUM]" }
"pbs:POST /config/drive" = { tier = "disruptive", why = "adds a new tape drive identifier {name!r} pointing at host device {path!r} — no existing drive/changer/job config is affected [pbs_tape_drive_create, RISK_MEDIUM]" }
"pbs:POST /config/encryption-keys" = { tier = "disruptive", why = "adds a new client encryption key {key_id!r} (additive — no existing key config is affected). Schema-verified: the create RETURNS NOTHING (module docstring fact #9) — check pbs_encryption_key_list afterward to see the assigned fingerprint/hint/kdf, if any. [pbs_encryption_key_create, RISK_MEDIUM]" }
"pbs:POST /config/encryption-keys/{id}" = { tier = "disruptive", why = "flips key {key_id!r}'s archived flag — PBS's own wording: archived keys 'are no longer usable to encrypt contents' (new content only; PBS's description says nothing about decrypting existing content either way). Check pbs_encryption_key_list first to know which direction this toggle moves — archiving an ACTIVE key or un-archiving an ARCHIVED one. [pbs_encryption_key_toggle_archive, RISK_MEDIUM]" }
"pbs:POST /config/media-pool" = { tier = "restorable", why = "adds a new media pool {name!r} — no existing pool/drive/changer/job config is affected [pbs_tape_pool_create, RISK_LOW]" }
"pbs:POST /config/metrics/influxdb-http" = { tier = "disruptive", why = "creates a new InfluxDB http metrics server config {name!r} — PBS will begin pushing host/datastore metrics to this endpoint; no existing config is affected [pbs_metrics_influxdb_http_create, RISK_MEDIUM]" }
"pbs:POST /config/metrics/influxdb-udp" = { tier = "restorable", why = "creates a new InfluxDB udp metrics server config {name!r} — PBS will begin pushing host/datastore metrics to this endpoint over UDP (fire-and-forget, no delivery guarantee); no existing config is affected [pbs_metrics_influxdb_udp_create, RISK_LOW]" }
"pbs:POST /config/notifications/targets/{name}/test" = { tier = "disruptive", why = "sends a REAL test notification out to the target's recipients, webhook or gotify server; a message sent cannot be unsent [John, 2026-10-24: all as proposed]" }
"pbs:POST /config/prune" = { tier = "restorable", why = "adds a new PBS prune scheduled job (no existing data affected) | additive config — creates a new PBS scheduled job [pbs_job_create, RISK_LOW]" }
"pbs:POST /config/s3" = { tier = "disruptive", why = "creates a new S3 client config {s3_id!r} with a stored access-key/secret-key pair — a persistent credential entry PBS can use to authenticate to the configured endpoint; no existing config is affected [pbs_s3_client_create, RISK_MEDIUM]" }
"pbs:POST /config/tape-backup-job" = { tier = "restorable", why = "adds a new scheduled tape backup job {job_id!r} — no existing job/pool/drive config is affected until its schedule (if any) fires or it is run manually [pbs_tape_backup_job_create, RISK_LOW]" }
"pbs:POST /config/tape-encryption-keys" = { tier = "disruptive", why = "adds a new tape encryption key (additive — no existing key/pool/job config is affected); the new key's fingerprint is returned on confirm=True [pbs_tape_key_create, RISK_MEDIUM]" }
"pbs:POST /config/verify" = { tier = "restorable", why = "adds a new PBS verify scheduled job (no existing data affected) | additive config — creates a new PBS scheduled job [pbs_job_create, RISK_LOW]" }
"pbs:POST /nodes/{node}/certificates/acme/certificate" = { tier = "disruptive", why = "requests a cert from the configured ACME CA for this PBS node | on SUCCESS, PBS installs the cert; on a failed DNS/HTTP challenge, the existing cert is left untouched [pbs_acme_cert_order, RISK_MEDIUM]" }
"pbs:POST /nodes/{node}/certificates/custom" = { tier = "destructive", why = "node TLS certificate: a malformed cert/key pair can lock you out of the PBS web UI and API [pbs_node_cert_upload, RISK_HIGH]" }
"pbs:POST /nodes/{node}/disks/directory" = { tier = "destructive", why = "FORMATS disk {disk!r} into the new directory datastore {name!r} on PBS node {node!r} — any pre-existing data on that disk is destroyed immediately and irreversibly{extra_note} [pbs_node_disk_directory_create, RISK_HIGH]" }
"pbs:POST /nodes/{node}/disks/initgpt" = { tier = "destructive", why = "disk {disk!r} on PBS node {node!r}: overwrites the partition table — existing partitions and their data are rendered inaccessible [pbs_node_disk_initgpt, RISK_HIGH]" }
"pbs:POST /nodes/{node}/disks/zfs" = { tier = "destructive", why = "FORMATS device(s) {devices!r} into the new zpool/datastore {name!r} on PBS node {node!r} — any pre-existing data on those disks is destroyed immediately and irreversibly{extra_note} | NO undo path exists in PBS's own API: there is no delete endpoint for a zpool created this way (module docstring gap #3) — recovery requires manual host-level intervention (zpool destroy outside this API) [pbs_node_disk_zfs_create, RISK_HIGH]" }
"pbs:POST /nodes/{node}/subscription" = { tier = "restorable", why = "node/{node} subscription cache — refreshed from Proxmox's server; no key/identity change [pbs_node_subscription_check, RISK_LOW]" }
"pbs:POST /tape/backup" = { tier = "destructive", why = "writes datastore {store!r}'s contents to tape via drive {drive!r} — the drive is busy for the duration; does not itself destroy any prior content on the target tape (that risk belongs to format-media/label-media, Wave 4c) [pbs_tape_backup, RISK_MEDIUM]" }
"pbs:POST /tape/backup/{id}" = { tier = "disruptive", why = "triggers a real tape backup using job {job_id!r}'s CONFIGURED drive/pool/store/filters — the drive is busy for the duration and real data is written to tape [pbs_tape_backup_job_run, RISK_MEDIUM]" }
"pbs:POST /tape/changer/{name}/transfer" = { tier = "restorable", why = "changer {name!r}'s robot arm physically moves whatever cartridge occupies slot {from_slot} into slot {to_slot} — no drive interaction, no in-flight job is interrupted [pbs_tape_changer_transfer, RISK_LOW]" }
"pbs:POST /tape/drive/{drive}/barcode-label-media" = { tier = "destructive", why = "OVERWRITES the mounted tape's identity in PBS's catalog/media-set bookkeeping. Any backup data previously written under the OLD label becomes ORPHANED and effectively unaddressable through normal PBS tooling — same consequence as pbs_tape_drive_label_media, sourced from the changer's barcode scan instead of a caller-supplied label-text. [pbs_tape_drive_barcode_label_media, RISK_HIGH]" }
"pbs:POST /tape/drive/{drive}/catalog" = { tier = "disruptive", why = "reads (does not modify) the tape mounted in drive {drive!r}; writes/updates the LOCAL PBS catalog database entry for this media — force=True overrides an existing catalog index for it; scan=True re-reads the whole tape (can tie up the drive for the full read duration) [pbs_tape_drive_catalog, RISK_MEDIUM]" }
"pbs:POST /tape/drive/{drive}/eject-media" = { tier = "disruptive", why = "drive {drive!r} becomes empty; on a standalone (non-changer) drive the cartridge is physically ejected and requires a HUMAN to retrieve/reinsert it — no robot arm to undo this [pbs_tape_drive_eject, RISK_MEDIUM]" }
"pbs:POST /tape/drive/{drive}/label-media" = { tier = "destructive", why = "OVERWRITES the mounted tape's identity in PBS's catalog/media-set bookkeeping. Any backup data previously written under the OLD label becomes ORPHANED and effectively unaddressable through normal PBS tooling — this does not erase raw bytes the way format-media does, but the practical effect for anyone who didn't intend it is the same as data loss. PBS's own guidance: the media should be empty (format it first). [pbs_tape_drive_label_media, RISK_HIGH]" }
"pbs:POST /tape/drive/{drive}/load-media" = { tier = "disruptive", why = "drive {drive!r} is busy for the duration of the mount; whatever cartridge (if any) was previously mounted is displaced — no data is touched, this is a physical mount action only [pbs_tape_drive_load_media, RISK_MEDIUM]" }
"pbs:POST /tape/drive/{drive}/load-slot" = { tier = "disruptive", why = "drive {drive!r} is busy for the duration of the mount; whatever cartridge (if any) was previously mounted is displaced — no data is touched, this is a physical mount action only [pbs_tape_drive_load_slot, RISK_MEDIUM]" }
"pbs:POST /tape/drive/{drive}/restore-key" = { tier = "disruptive", why = "attempts to recover/re-register an encryption key's usability using the media mounted in drive {drive!r} and the supplied password; on success, changes what tape content becomes decryptable going forward [pbs_tape_drive_restore_key, RISK_MEDIUM]" }
"pbs:POST /tape/drive/{drive}/rewind" = { tier = "restorable", why = "drive {drive!r}'s tape head repositions to the start of the medium — no mount/unmount, no data touched [pbs_tape_drive_rewind, RISK_LOW]" }
"pbs:POST /tape/drive/{drive}/unload" = { tier = "disruptive", why = "drive {drive!r} becomes empty; the previously-mounted cartridge is physically returned to {slot_desc} — no data is touched [pbs_tape_drive_unload, RISK_MEDIUM]" }
"pbs:POST /tape/media/list/{uuid}/status" = { tier = "disruptive", why = "changes whether PBS considers medium {uuid!r} available for future writes — 'retired'/'damaged' take it out of rotation (or correctly protect a bad tape); clearing the override (status omitted) reverts to PBS's own internally-managed writable/unknown state. Tape content is not touched either way. [pbs_tape_media_status_set, RISK_MEDIUM]" }
"pbs:POST /tape/media/move" = { tier = "disruptive", why = "updates PBS's location bookkeeping for this medium to {dest} — does NOT physically move anything; a scheduled job or inventory operation expecting this medium to be online in a changer fails to find it (or vice versa) until the bookkeeping matches physical reality again. Omitting vault_name sets OFFLINE, NOT a no-op. [pbs_tape_media_move, RISK_MEDIUM]" }
"pbs:PUT /access/users/{userid}/unlock-tfa" = { tier = "destructive", why = "clears any TOTP lockout for {userid!r}, allowing further login attempts | REMOVES the anti-brute-force throttle protecting a 6-digit TOTP keyspace — an account-takeover enabler if the lockout was triggered by a real guessing attack | a no-op if the user was not actually locked out [pbs_tfa_unlock, RISK_HIGH]" }
"pbs:PUT /admin/datastore/{store}/group-notes" = { tier = "restorable", why = "annotation on {desc} — does not affect backup data, retention, or protection (the first line becomes the group's 'comment' in listings) [pbs_group_notes_set, RISK_LOW]" }
"pbs:PUT /admin/datastore/{store}/s3-refresh" = { tier = "disruptive", why = "the LOCAL cache store for '{store}' is overwritten/reconciled from the S3 backend; the datastore passes through 's3-refresh' maintenance mode while the task runs (PBS's own maintenance-mode enum names this state), affecting availability for the duration [pbs_datastore_s3_refresh, RISK_MEDIUM]" }
"pbs:PUT /admin/s3/{s3-endpoint-id}/check" = { tier = "disruptive", why = "makes a REAL outbound call from PBS to the configured S3 endpoint using its stored access key and secret; it changes no PBS config, and what leaves the box cannot be called back [John, 2026-10-24: all as proposed]" }
"pbs:PUT /admin/s3/{s3-endpoint-id}/reset-counters" = { tier = "restorable", why = "resets observability counters (S3 request counts) for the matching endpoint/bucket/prefix — NOT data; no backup/config content is touched [pbs_s3_reset_counters, RISK_LOW]" }
"pbs:PUT /config/access/ad/{realm}" = { tier = "disruptive", why = "updates AD realm {realm!r} connection/sync settings [pbs_realm_ad_update, RISK_MEDIUM]" }
"pbs:PUT /config/access/ldap/{realm}" = { tier = "disruptive", why = "updates LDAP realm {realm!r} connection/sync settings [pbs_realm_ldap_update, RISK_MEDIUM]" }
"pbs:PUT /config/access/openid/{realm}" = { tier = "disruptive", why = "updates OpenID realm {realm!r} connection settings [pbs_realm_openid_update, RISK_MEDIUM]" }
"pbs:PUT /config/access/pam" = { tier = "disruptive", why = "updates the built-in PAM realm's comment/default-preselect flag | PAM cannot be deleted or disabled via this endpoint — no lockout path here [pbs_realm_pam_set, RISK_MEDIUM]" }
"pbs:PUT /config/access/pbs" = { tier = "disruptive", why = "updates the built-in PBS-auth realm's comment/default-preselect flag | this realm cannot be deleted or disabled via this endpoint — no lockout path here [pbs_realm_pbs_set, RISK_MEDIUM]" }
"pbs:PUT /config/changer/{name}" = { tier = "disruptive", why = "tape changer {name!r}: changes which host device this identifier maps to, and/or its export-slot/eject behavior — drives associated with this changer are affected on their next job run [pbs_tape_changer_update, RISK_MEDIUM]" }
"pbs:PUT /config/drive/{name}" = { tier = "disruptive", why = "tape drive {name!r}: changes which host device / changer association future tape jobs use — a job scheduled against this drive is affected on its next run [pbs_tape_drive_update, RISK_MEDIUM]" }
"pbs:PUT /config/media-pool/{name}" = { tier = "disruptive", why = "media pool {name!r}: changes allocation/retention policy and/or the encryption-key association — future tape-backup jobs writing into this pool target/reuse tapes under the new policy on their next run [pbs_tape_pool_update, RISK_MEDIUM]" }
"pbs:PUT /config/metrics/influxdb-http/{name}" = { tier = "disruptive", why = "InfluxDB http metrics server {name!r}: rotating the token/url/bucket can silently redirect or break metrics delivery until the change is verified [pbs_metrics_influxdb_http_update, RISK_MEDIUM]" }
