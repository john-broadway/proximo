# ── ARGUMENT NAMES THE NAME RULE WOULD HIDE THAT ARE NOT SECRET VALUES (2026-10-26, lens 5 B1) ───────
# `engine._SECRET_NAME` fingerprints a mutation's argument by its NAME (`pass`, `secret`, `key`, `token`...):
# total over whatever a caller sends, and wrong where the name only SOUNDS secret. A `public` list is the
# authored judgement, per address, with a why, that these names are an identifier, a public key, a path or a
# boolean: the plan shows the value, the operator's view prints it, and the receipt records it, so PROVE
# can say which token got the role. A name NOT listed here stays fingerprinted (a new hide is a decision:
# tests/test_secret_names.py pins the list the rule still hides). The build refuses a line whose names the
# rule would not have hidden anyway (it would do nothing), or that the address does not publish.
"pbs:POST /config/s3" = { public = ["access-key"], public_why = "`access-key` is the S3 access key ID, an identifier; the secret key is a separate parameter the name rule fingerprints [Claude, 2026-10-26, lens 5 B1]" }
