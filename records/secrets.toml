# THE SECRET RECORD. Hand-authored; a why on every line.
#
# A read the door serves hands the model the vendor's bytes. Where those bytes carry a
# credential, the door withholds the field before the envelope is built, on BOTH doors (the
# governed engine and the raw GET door), and names what it withheld (`withheld` in the
# envelope) so an absent field is never mistaken for an unset one.
#
#   "plane:GET /path" = { drop = [...], userinfo = [...], why = "..." }
#
#   drop      field names removed at any depth of the response (a list's rows, a nested table)
#   userinfo  field names whose value keeps host[:port] but loses an embedded user[:pass]@
#   rows      option names whose `{key, value, pending}` row has its value and pending withheld
#             (PVE's pending/cloud-init reads name the option in `key`, the secret sits in `value`)
#   text      true: a string body's cloud-config `password:` lines are masked (the rendered
#             cloud-init user-data)
#
# A mutation's answer is withheld by its OWN line merged with its READ's line (same path): a PUT
# that echoes the resource carries what the read carries, and a mint that answers a secret its
# read never shows carries its own line (merged by the build onto the row's `secret`; lines on mutations below).
#
# Where the lines come from (2026-09-24):
#   1. every read the 0.44 wrappers stripped before the model saw it (the `_strip_*` family in
#      the backend modules and pbs_admin's http-proxy mask). A wrapper's strip was a secret
#      contract the door did not keep: the door served these addresses raw. The guard
#      `tests/test_secret_record.py` holds each stripping backend to a line here.
#   2. every GET whose vendor return schema (the published api-viewer apidoc.js, all four
#      planes) declares a credential-bearing field, read field by field. A name alone is not
#      the test: `tokenid`, `public_key`, a config KEY name, apt `Options.Key` and a tape's
#      `medium-passes` are not credentials; ACME plugin `data` is one (DNS-provider API keys)
#      though its name says nothing.
#
# NOT here, on purpose:
#   pdm:GET /subscriptions/keys(/{key})  the key is the resource's own name, in its own path;
#                                        withholding it would serve a list of nothing
#   pdm:GET /auto-install/prepared authorized-tokens  token IDs, not token secrets
#   any `tokens` / `tokenid` field        token metadata (id, comment, expiry), never the secret
#
# RESIDUAL: a vendor schema that declares no return shape (`returns: {}`) says nothing either
# way. Such an address is here only when a wrapper once stripped it (source 1).

