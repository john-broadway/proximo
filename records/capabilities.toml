# THE CAPABILITY RECORD: what Proximo does for the person running it, why it exists, and the test
# that proves it still does.
#
# Why this file exists. 0.45.0's cut deleted everything outside `src/proximo/core/` by DIRECTORY.
# Twenty-five capabilities went with the wrappers they sat beside, seventeen of them never judged
# one by one, seven of them fixes for things that went wrong on a real box. A cut list of files
# is not a list of capabilities. This record is: a capability leaves only by a ruling written on
# its own row, and `tests/test_capabilities.py` fails when a proving test disappears, when a row
# disappears, or when a retirement carries no ruling.
#
# A row is `[capability.<id>]` with:
#   what    one sentence: what the operator gets
#   origin  where it came from: `field:` (a real box, with the date or release) or `design:`
#   status  standing  · it works today; `proof` names the tests that hold it (file::function)
#           unproven  · believed working today, but no test pins the case that earned it
#           owed      · lost in a cut and coming back; `was` names the 0.44 code it restores from
#           ask       · lost or cut, and the owner has not ruled on bringing it back (none today)
#           retired   · gone on purpose; `ruling` (who, when) and `instead` (what does it now)
#   proof   tests, required for standing; a proof test may not be skipped or xfailed
#   was     0.44 locations (removed in 0.45.0), required for owed and ask
#   ruling, instead   required for retired
#
# A row is never deleted. A capability that goes away is `retired`, by name, with its ruling.

# ---- STANDING: field-born fixes the core carries today --------------------------------------

