# Proximo target registry — copy to e.g. /etc/proximo/targets.toml (chmod 600) and point
# PROXIMO_TARGETS at it. Then any tool can be aimed at a named remote with target="name" (the shell door: --target name).
#
#   - No target (or it is omitted) => the env-configured box (PROXIMO_* vars), unchanged.
#   - Each [targets.<name>] is ONE remote of ONE kind: pve | pbs | pmg | pdm.
#   - Secrets stay BY REFERENCE — token_path / password_path point at a chmod-600 file holding the
#     secret. The registry NEVER contains a token or password value.
#   - A call checks kind: plane="pbs" given a pve target errors (no silent cross-plane call).
#   - Arming (read-only -> operator) stays out-of-band and per-target: it swaps the token at that
#     target's token_path. Proximo's code only ever reads whatever token is there.
#   - If you use the arm pattern (PROXIMO_ARM_SOURCE) AND enable exec on a target, give that
#     target its own `arm_source` (and optionally `readonly_source`). They are NOT inherited from
#     the env: the env pair belongs to the default box, and one box's arm must never authorize
#     another. A target with exec enabled and no arm_source is REFUSED, not permitted.
#   - PVE targets may map path node names to SSH destinations under [targets.<name>.nodes].
#     A missing mapping refuses before consent, rate, snapshot or SSH; it never falls back to
#     PROXIMO_SSH_TARGET. API calls do not need a map.
#   - Before pct runs, the remote hostname must equal the node in the path. This operational guard
#     does not prove that the API and SSH endpoints belong to the same cluster.
#   - This file is runtime config, like the env — keep it untracked.
#   - Audit/PROVE settings (audit_key_path, audit_keyed, audit_expected_head, audit_log) are
#     INSTANCE-level — the PROVE ledger is ONE chain built from the env. They have NO effect
#     inside a [targets.*] table; set them via PROXIMO_AUDIT_* env vars instead.

# --- internal PVE (RFC1918, reached over the LAN) ---
[targets.home-pve]
kind       = "pve"
base_url   = "https://pve.example.lan:8006/api2/json"
token_path = "/etc/proximo/home-pve.token"   # file holds: USER@REALM!TOKENID=SECRET
verify_tls = true
ca_bundle  = "/etc/proximo/home-pve-ca.pem"   # preferred over disabling TLS verify
# tls_strict = false   # with the cluster CA as ca_bundle: relaxes ONLY its X509 strictness (PVE's root has no keyUsage)
# arm_source      = "/etc/proximo/home-pve.operator-token"   # THIS box's write token (armgate)
# readonly_source = "/etc/proximo/home-pve.token.readonly"   # its read-only counterpart

[targets.home-pve.nodes]
pve-01 = "home-pve01"   # OpenSSH alias; SSH config holds user, key, port and host key policy
pve-02 = "home-pve02"

# --- external PVE (public FQDN, e.g. a colocated or partner cluster) ---
[targets.edge-pve]
kind       = "pve"
base_url   = "https://edge.example.com:8006/api2/json"
token_path = "/etc/proximo/edge-pve.token"
verify_tls = true
ca_bundle  = "/etc/proximo/edge-pve-ca.pem"

[targets.edge-pve.nodes]
edge-01 = "root@edge-01.example.com"

# --- Proxmox Backup Server ---
[targets.home-pbs]
kind       = "pbs"
base_url   = "https://pbs.example.lan:8007"
token_path = "/etc/proximo/home-pbs.token"    # PBS token format: USER@REALM!TOKENID:SECRET
verify_tls = true
ca_bundle  = "/etc/proximo/home-pbs-ca.pem"

# --- Proxmox Mail Gateway ---
[targets.mail-pmg]
kind          = "pmg"
base_url      = "https://pmg.example.lan:8006"
password_path = "/etc/proximo/pmg.pw"          # PMG uses ticket auth (username + password file)
username      = "root@pam"
# In this PASSWORD mode PMG takes no arm_source: a swap changes only the password, never the user,
# so the governed door refuses every PMG mutation on this target, and says why. For an arm pair use
# CREDENTIAL mode instead of the two lines above (core doors only; one mode, not both):
#   credential_path = "/etc/proximo/pmg.cred"     # two lines: user@realm, then the password
#   arm_source      = "/etc/proximo/pmg.cred.write"
#   readonly_source = "/etc/proximo/pmg.cred.audit"
verify_tls    = true

# --- Proxmox Datacenter Manager ---
[targets.dc]
kind       = "pdm"
base_url   = "https://pdm.example.lan:8443"     # /api2/json appended automatically if omitted
token_path = "/etc/proximo/pdm.token"
verify_tls = true
