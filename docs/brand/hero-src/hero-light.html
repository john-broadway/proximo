<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 2560px; height: 920px; overflow: hidden; }
  body { width: 1280px; height: 460px; overflow: hidden; }
  body { zoom: 2; }
  body {
    background:
      radial-gradient(1200px 700px at 20% -10%, #f5eeddff 0%, #efe6d2 45%, #e8dcc2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stack { text-align: center; }
  .eyebrow {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 29px;
    letter-spacing: 0.26em;
    text-indent: 0.26em;
    color: #8a6a3b;
    text-transform: uppercase;
  }
  .wordmark {
    font-family: "Cinzel", serif;
    font-weight: 400;
    font-size: 136px;
    letter-spacing: 0.10em;
    text-indent: 0.10em;
    color: #a06f2b;
    line-height: 1.08;
    margin-top: 2px;
  }
  .tagline {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 55px;
    line-height: 1.22;
    color: #2e2618;
    margin-top: 10px;
  }
  .tagline .keys { color: #2e2618; }
  .tagline b { color: #a4571f; font-weight: 600; }
  .quote {
    font-family: "EB Garamond", Georgia, serif;
    font-size: 27px;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: #99805a;
    text-transform: uppercase;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="eyebrow">A Proxmox MCP server &middot; the lanista&rsquo;s cut</div>
    <div class="wordmark">PROXIMO</div>
    <div class="tagline">
      <span class="keys">Hand your AI agent the keys:</span><br>
      <b>planned, proven, undone.</b> Keep the receipts.
    </div>
    <div class="quote">Win the crowd &middot; and you will win your freedom</div>
  </div>
</body>
</html>
