# Dependabot — keep pinned Actions and the Docker base image current, grouped so updates arrive as
# a few tidy PRs instead of one-per-package. Majors stay ungrouped on purpose (a breaking bump
# deserves its own reviewed PR).
#
# NOTE — no `pip` ecosystem here, on purpose. proximo is uv-managed: requirements/*.txt are
# hash-pinned `uv export` artifacts, and Dependabot (which has no `uv` ecosystem) can only edit
# them package-by-package — it cannot run `uv` to move a parent+child pin or a lockstep transitive
# together. That produces un-installable PRs (e.g. bumping pydantic-core past pydantic's exact pin,
# or protobuf past the proto-plus/grpc cap). Python dependency currency is handled by
# `uv lock --upgrade` + re-export (the four commands in each requirements/*.txt header), gated by
# the full test suite.
#
# SECURITY updates run off the dependency graph, independent of this file
# (automated-security-fixes + vulnerability-alerts are ENABLED), so a CVE is reliably DETECTED.
# It is NOT reliably REMEDIATED, and an earlier version of this note claimed otherwise. The
# 2026-08-05/06 cryptography advisory showed all three ways the auto-fix arm fails here:
#   * `uv in /.` errors "Declaration not found for <pkg>" when the package is declared only under
#     [project.optional-dependencies]. cryptography lives in the a2a/http/mcp-http extras, never
#     in [project] dependencies, so that updater cannot edit the bound at all.
#   * `pip in /requirements` CAN edit requirements/*.txt, but those are `uv export` artifacts, so
#     the PR arrives out of step with uv.lock and the requirements-drift test fails it. That PR
#     shape is un-mergeable by construction; do not "fix" it by editing the exports by hand.
#   * When the patched version sits OUTSIDE our own cap, no updater can reach it at all.
#     GHSA-g6cj-pr64-35w5 was patched in 50.0.0 while the extras still said `cryptography<50`, so
#     our own published metadata held adopters inside the advisory (fixed by hand in a7d2d22).
# Because that auto-fix arm cannot be trusted to produce a mergeable PR here, the DETECTOR we
# rely on is ours, not Dependabot's: the blocking `pip-audit` job in ci.yml, which since
# 2026-08-08 runs DAILY on a schedule rather than only on push. That trigger is the actual
# repair for this whole failure mode. The cryptography advisory sat unnoticed for three days
# not because nothing was watching, but because the thing that was watching only woke on a
# push, and nobody pushed. A red "Dependabot Updates" run is still worth reading, but it is
# now the secondary signal, and it is allowed to stay red for the structural reasons above.
#
# When the gate fires, fix by hand: move BOTH bounds (widening the cap alone still permits the
# vulnerable pin, which is why the floor is written as a security bound), then
# `uv lock --upgrade-package <pkg>` + re-export, and prove it on the built wheel's METADATA
# rather than on the source.
version: 2
updates:
  # Keep GitHub Actions current — especially the SHA-pinned privileged actions in the release
  # workflows (login / build-push / attest / pypi-publish).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Grouped for minor/patch only. A major is a breaking bump and gets its own PR, so the
      # review is on one action instead of buried in a "N updates" batch. Without this
      # `update-types` line the group swallows majors too: PR #47 carried setup-python v6 to v7
      # inside a routine-looking batch, which is exactly what the header claims does not happen.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep the Docker base image digest current. The Dockerfile pins python:3.13-slim by sha256
  # (reproducible builds); without this the base would never get upstream security updates.
  # Merged bumps are re-scanned by the Trivy workflow on push to main. Stay on the 3.13 line —
  # take digest/patch, not a 3.14 tag jump (moving the shipped Python minor is a reviewed change).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
