name: Release — GHCR image

# Build the stdio MCP image and publish it to GHCR when a GitHub Release is
# published (the release tag carries the version). Also runnable by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Semver to tag the image with (e.g. 0.27.0). Only for a hand-run rebuild when the
          release event's own run could not produce an image — the tags otherwise come from the
          git ref, and a branch ref carries no semver. Also moves `latest`, because a release
          whose image arrived late is still that release's image. Leave blank for a plain
          sha-tagged dispatch.
        required: false
        type: string

env:
  # ghcr.io/john-broadway/proximo — matches the pull path documented in the README.
  IMAGE: ghcr.io/${{ github.repository }}

# Default every job to read-only; the `image` job re-grants exactly what it needs.
# Without this floor the test job would inherit the repo-default token scope.
permissions:
  contents: read

jobs:
  # Don't publish an image for a release whose code doesn't pass. This mirrors
  # ci.yml on the image's Python. If you'd rather trust main's CI and publish
  # faster, delete this job and the `needs: test` line below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"   # the version baked into the image
      - name: Install (hash-pinned lockfiles; the project itself --no-deps)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -ra

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      packages: write      # push to GHCR
      id-token: write      # keyless (sigstore) signing of the provenance attestation
      attestations: write  # attach the build-provenance attestation to the image
    steps:
      # Refuse a malformed hand-typed version BEFORE anything is built or pushed: it becomes an
      # image tag, and a junk tag in a public registry is not something you quietly take back.
      # Kept as a step rather than its own job on purpose — a separate job would have to be
      # conditional on the input, and a SKIPPED dependency skips its dependents, which would
      # have silently stopped building images on every ordinary release.
      # The value reaches the shell only via env, never ${{ }} inside run:, so it cannot inject.
      - name: Refuse a version input that is not a bare semver
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          printf 'version input: %s\n' "$VERSION"
          printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+[-.a-z0-9]*$' || {
            echo "::error::version must look like 0.27.0 — refusing to tag an image with it"
            exit 1
          }

      # The {{major}}.{{minor}} floating tag also comes from the ref, so a versioned hand-run
      # would otherwise publish 0.27.0 without its 0.27 companion — which is what happened the
      # first time. Derived here, from the value already validated above.
      - name: Derive the major.minor floating tag
        id: mm
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MM="${VERSION%.*}"
          printf 'majorminor=%s\n' "$MM" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Multi-arch: amd64 for Proxmox hosts/servers, arm64 for Apple-Silicon
      # workstations (the image runs wherever the MCP client lives). Proximo's
      # deps ship manylinux/musllinux wheels, so arm64 builds don't compile from source.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Cold-start smoke BEFORE the push: build amd64 only, load it into the local daemon, and run
      # the entrypoint. Until now the multi-arch build pushed an image whose ENTRYPOINT was never
      # executed — an import error in any wrapper module would ship and only surface on an adopter's
      # first run. `proximo --help` imports the whole tool surface (server.py registers every tool
      # at import), so a broken import crashes here instead of in a registry. The real multi-arch
      # build+push below reuses these layers from the gha cache, so the second build is cheap.
      # Bound: this proves amd64 only; arm64 rides on the same source + manylinux/musllinux wheels.
      - name: Build amd64 image for the cold-start smoke (load, don't push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: proximo:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The entrypoint must actually run
        run: |
          set -euo pipefail
          out="$(docker run --rm proximo:smoke --help)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'Proxmox MCP server' || {
            echo "::error::image entrypoint did not print the expected usage — the wheel may not import"
            exit 1
          }

      - name: Log in to GHCR
        # The next three actions are SHA-pinned (not floating tags): they hold the
        # token, publish the image, and sign provenance — a re-pointed tag here would
        # be a supply-chain hole. Dependabot bumps the SHA and the `# vN` comment.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in token; no PAT needed for same-owner push

      - name: Derive tags + OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # semver {{version}} (e.g. 0.1.1) + {{major}}.{{minor}} (0.1); 'latest' only on a real
          # Release; and a sha-<short> always present so manual workflow_dispatch runs stay valid.
          # (Inline comments must stay OUT of the tags block — metadata-action v6 parses them as
          # part of the value, unlike v5.)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.mm.outputs.majorminor }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || inputs.version != '' }}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true            # ship an SPDX SBOM alongside the image
          provenance: false     # provenance comes from the signed attestation below (avoid duplicating it)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # PROVE, one layer down: a sigstore-signed build-provenance attestation that
      # anyone can check with:  gh attestation verify oci://<image> --owner john-broadway
      # On-thesis for Proximo. To ship a bare image instead, delete this step and the
      # id-token/attestations permissions above.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Mirror the freshly-pushed GHCR image to Docker Hub (same digest, no rebuild).
  # GHCR exposes no pull counts; Docker Hub does — this is the container-reach metric.
  # Self-skips cleanly if DOCKERHUB_TOKEN is unset. Only on real releases (a
  # workflow_dispatch of this file has no release.tag_name to mirror).
  mirror-to-dockerhub:
    needs: image
    # Also on a versioned hand-run rebuild: the counting mirror should not silently miss a
    # release whose image arrived late. The called workflow strips a leading `v` itself and
    # validates the tag, so either shape is safe to hand it.
    if: github.event_name == 'release' || inputs.version != ''
    # Grant what the called reusable workflow requests (packages: read to pull the GHCR source
    # image). The top-level token is contents:read only; without re-granting here, the reusable
    # call requests more than this job's token can provide and GitHub fails release.yml at startup.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/dockerhub-mirror.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.version }}
    secrets: inherit
