name: Release — PyPI (Trusted Publishing)

# Tokenless publish to PyPI via OIDC, gated behind the `pypi` Environment's
# required-reviewer rule (John approves before anything goes public).
#   - real release: when a GitHub Release is published
#   - dry run:      workflow_dispatch -> TestPyPI (prove the OIDC path first)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (verify-only publishes NOTHING — it re-verifies an already-published version)"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi, verify-only]
      verify-version:
        description: "For verify-only: the published tag to verify (e.g. v0.33.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Don't publish a wheel whose suite is red. release.yml gates the GHCR image on its own `test`
  # job, but nothing gated the PyPI path — publish-pypi needed only `build`, so a green-build /
  # red-test commit could be published on one approval click. Mirrors ci.yml's `test` on 3.12.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (hash-pinned lockfiles; the project itself --no-deps)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -ra

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # gh release upload of the SBOM + signed provenance
      id-token: write      # OIDC — keyless (sigstore) signing of the release provenance
      attestations: write  # record the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag == version == CHANGELOG top heading (real releases only)
        if: github.event_name == 'release'
        run: python scripts/version_tools.py release-check "${GITHUB_REF_NAME#v}"

      - name: Build sdist + wheel (hash-pinned build tooling, no isolated env)
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation

      # Receipts: a CycloneDX SBOM for the *published wheel's* dependency tree —
      # generated from a clean venv with exactly the wheel installed, kept OUT of
      # dist/ so the PyPI publish step never sees it. (The container image already
      # ships an SPDX SBOM; this covers the pip/uvx install path.)
      - name: Generate CycloneDX SBOM for the wheel
        run: |
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install --quiet --require-hashes -r requirements/runtime.txt -r requirements/sbom.txt
          /tmp/sbom-env/bin/pip install --quiet --no-deps dist/*.whl
          mkdir -p sbom
          /tmp/sbom-env/bin/python -m cyclonedx_py environment --of JSON \
            -o "sbom/proximo-proxmox-${GITHUB_REF_NAME#v}-sbom.cdx.json" /tmp/sbom-env/bin/python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/

      - name: Attach SBOM to the GitHub release (real releases only)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sbom/*.cdx.json --clobber

      # PROVE, at the artifact layer: a sigstore-signed build-provenance attestation
      # over the exact sdist + wheel that ship. Verifiable with
      # `gh attestation verify <file> --owner john-broadway`. This is the same
      # first-party action the GHCR image already uses (release.yml).
      - name: Attest build provenance for the release artifacts (real releases only)
        if: github.event_name == 'release'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      # Attach the signed provenance bundle to the GitHub Release so it travels with
      # the artifacts. Named *.intoto.jsonl so the OpenSSF Scorecard Signed-Releases
      # check recognizes the release as carrying provenance.
      - name: Attach signed provenance to the GitHub release (real releases only)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "proximo-proxmox-${GITHUB_REF_NAME#v}.intoto.jsonl"
          gh release upload "$GITHUB_REF_NAME" \
            "proximo-proxmox-${GITHUB_REF_NAME#v}.intoto.jsonl" --clobber

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC — no token/secret
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, test]   # test gate: no publish over a red suite (F2)
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi    # required-reviewer rule pauses here for John's approval
    permissions:
      id-token: write    # OIDC — no token/secret
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # Prove the PUBLISHED wheel actually runs: install it from PyPI into a clean venv and drive a
  # real MCP `initialize` + `tools/list` over stdio. Until now read-back was manual ("6/6 by
  # hand") and nothing executed the shipped artifact's entrypoint. Real releases only — a
  # workflow_dispatch has no tag to install. No permissions needed (installs from PyPI, writes
  # only a temp script); the version assertion also proves it's the TAGGED wheel, not a stale
  # cache hit. Runs on every path that publishes to real PyPI (release, dispatch-to-pypi) and
  # on verify-only dispatch. Since the 0.33.0 dual-major port the matrix drives the same cold-start once per
  # mcp major: the client venv is PINNED per leg and the resolved major asserted, because an
  # unpinned install silently follows whatever PyPI resolves that day (the v0.33.0 run resolved
  # mcp 2.0.0 and this job's 1.x-spelled `serverInfo` read broke on the client side while the
  # published server answered fine).
  verify-pypi:
    needs: publish-pypi
    # Three ways in: a real release (only after its publish succeeded), a dispatch-to-pypi
    # (same — a manual production publish gets the same proof), or a verify-only dispatch
    # against a version ALREADY on PyPI (publish-pypi is skipped then, hence the
    # !cancelled() — a bare `if` would let the skipped need skip us too). A dispatch with
    # an empty verify-version fails RED in the first step rather than skipping: a run that
    # verified nothing must never read as green.
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'release' && needs.publish-pypi.result == 'success') ||
           (github.event_name == 'workflow_dispatch' &&
            (inputs.target == 'verify-only' ||
             (inputs.target == 'pypi' && needs.publish-pypi.result == 'success')))) }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        mcp-major: ["1", "2"]
    env:
      VERSION: ${{ github.event_name == 'release' && github.ref_name || inputs.verify-version }}
      MCP_MAJOR: ${{ matrix.mcp-major }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Refuse a dispatch that names nothing to verify
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ -n "$VERSION" ] || { echo "::error::verify-version is required on dispatch (e.g. v0.33.0) — nothing was verified"; exit 1; }
      - name: Install the published wheel from PyPI (retry for index propagation)
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          if [ "$MCP_MAJOR" = "1" ]; then PIN="mcp>=1.24,<2"; else PIN="mcp>=2,<3"; fi
          python -m venv /tmp/verify-env
          for i in $(seq 1 20); do
            if /tmp/verify-env/bin/pip install --quiet "proximo-proxmox==$V" "$PIN"; then
              echo "installed proximo-proxmox==$V on attempt $i"; exit 0
            fi
            echo "not on PyPI yet (attempt $i/20) — waiting 30s"; sleep 30
          done
          echo "::error::proximo-proxmox==$V never became installable from PyPI"; exit 1
      - name: Cold-start the server over stdio and assert version + tools/list
        env:
          TAG: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          cat > /tmp/verify.py <<'PY'
          import asyncio, importlib.metadata, os, sys, tempfile
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          want = os.environ["TAG"].lstrip("v")
          # The leg's pin must have held — an unpinned resolve following PyPI's whim is
          # exactly how the v0.33.0 run broke. Major-aware spelling below, never a
          # getattr-with-default that would pass vacuously on both majors.
          major = int(os.environ["MCP_MAJOR"])
          resolved = importlib.metadata.version("mcp")
          assert int(resolved.split(".")[0]) == major, f"venv resolved mcp {resolved}, leg pins major {major}"

          async def main():
              d = tempfile.mkdtemp()
              tok = os.path.join(d, "verify.tok")
              with open(tok, "w") as fh:
                  fh.write("verify@pam!t=00000000-0000-0000-0000-000000000000")  # dummy; no live PVE
              os.chmod(tok, 0o600)  # the config guard refuses group/other-readable tokens
              env = {
                  **os.environ,
                  "PROXIMO_API_BASE_URL": "https://127.0.0.1:8006/api2/json",  # unreachable on purpose
                  "PROXIMO_NODE": "verify-node",
                  "PROXIMO_TOKEN_PATH": tok,
                  "PROXIMO_VERIFY_TLS": "true",
                  "PROXIMO_AUDIT_LOG": os.path.join(d, "verify-audit.log"),
              }
              params = StdioServerParameters(command="/tmp/verify-env/bin/proximo", args=[], env=env)
              async with stdio_client(params) as (r, w):
                  async with ClientSession(r, w) as s:
                      init = await asyncio.wait_for(s.initialize(), timeout=60)
                      si = init.server_info if major == 2 else init.serverInfo
                      assert si.name == "proximo", si.name
                      got = si.version
                      assert got == want, f"published wheel reports {got}, tag is {want}"
                      tools = await asyncio.wait_for(s.list_tools(), timeout=60)
                      n = len(tools.tools)
                      assert n > 0, "tools/list returned an empty surface"
                      print(f"cold-start OK on mcp {resolved}: proximo {got}, {n} tools served")
          asyncio.run(main())
          PY
          /tmp/verify-env/bin/python /tmp/verify.py
