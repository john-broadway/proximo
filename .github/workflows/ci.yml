name: CI

on:
  push:
    branches: [main]
  pull_request:
  # DAILY, and this is the gate's whole point rather than a nicety. The pip-audit job below is
  # a BLOCKING dependency-CVE gate, but a blocking gate only blocks when it RUNS, and until
  # this trigger existed CI ran on push alone. GHSA-g6cj-pr64-35w5 (HIGH, CVSS 8.2) published
  # 2026-08-03 against the pinned cryptography and this repo did not notice for three days,
  # because nothing pushed to main between 08-02 and 08-06 — it was caught by a human reading
  # the advisory feed, not by us. A quiet main was an unexamined main, and "we scan
  # dependencies" read as a continuous promise while being a per-push one.
  #
  # Daily rather than the weekly cadence codeql/trivy/scorecard use: those watch a base image
  # and source that change slowly, while a dependency CVE is disclosed against code we have
  # ALREADY shipped and pinned. Weekly would have left that same advisory sitting up to seven
  # days. Slot picked clear of the other three (03:27 / 04:41 / 05:23 Monday).
  #
  # It re-runs the whole suite, not just the audit, and that is deliberate: a scheduled run is
  # also the only thing that catches a test which rots without a commit behind it (see the
  # pacioli close-window fixtures, which expired on a calendar boundary and went red on an
  # innocent release commit a week later).
  schedule:
    - cron: "13 6 * * *"   # daily, 06:13 UTC
  # Manual re-run, and it is not decoration. v0.31.1 landed on main during a GitHub Actions
  # outage (incident opened 2026-08-06T15:22Z, impact critical), so no CI run was ever created
  # for that commit — GitHub does not backfill runs for a push its fleet missed. With push as
  # the only trigger there is NO way to verify such a commit here afterwards: the gap closes
  # only if some later, unrelated push happens to cover it. trivy.yml already carries this
  # trigger for the same reason. Dispatch against the ref you need (a release tag works).
  workflow_dispatch:

# Explicit read-only floor (fork PRs already get this, but be unambiguous).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # The dual-major port (A13): every push proves the suite on BOTH supported mcp majors.
        # Leg 1 runs the lock's own hash-pinned 1.x; leg 2 overrides to the newest 2.x so a
        # breaking 2.x release turns up here first, not in an adopter's fresh install.
        mcp-major: ["1", "2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-pinned lockfiles; the project itself --no-deps)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Pin the mcp major under test (2.x leg; the lock itself stays on 1.x by design)
        if: matrix.mcp-major == '2'
        # Deliberate exception to this job's --require-hashes guarantee: the 2.x SDK and its
        # transitive deps are not in the lock (the lock is constrained to 1.x), so this leg
        # installs them unpinned. Scope: test-only; nothing this step installs reaches a
        # shipped artifact (container/SBOM install from the hash-pinned exports).
        run: python -m pip install "mcp>=2,<3"
      - name: Assert the installed mcp major matches this leg (never trust the resolver)
        run: |
          python - <<'EOF'
          import importlib.metadata as m
          v = m.version("mcp")
          want = "${{ matrix.mcp-major }}"
          assert v.split(".")[0] == want, f"leg wants mcp {want}.x, resolved {v}"
          print(f"mcp {v} matches leg {want}")
          EOF
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -ra

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check version consistency (pyproject == __init__ == CHANGELOG == server.json)
        run: python scripts/version_tools.py check   # stdlib only, no install needed

  # requirements/*.txt are exports of uv.lock, and the `test` job installs them with pip,
  # so uv is absent there and the drift guard in tests/test_requirements_lock.py skips —
  # exactly where a stale export does its damage. That skip is why pyasn1 sat two days at
  # 0.6.3 in dev.txt while the lock already said 0.6.4 (alerts #3/#4). This job is the
  # environment where the guard cannot skip.
  requirements-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - name: Check requirements/*.txt still match uv.lock
        run: uv run --no-project --with pytest pytest tests/test_requirements_lock.py -q -ra

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so gitleaks scans commits, not just the tree
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        # Free for individual accounts — no GITLEAKS_LICENSE needed. GITHUB_TOKEN is
        # required to scan pull requests (gitleaks-action v2 breaking change).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    # Blocking gate: a new CVE in a pinned dependency reds CI until it's patched.
    #
    # Two lessons live here, each earned as a miss:
    #
    # 1) THE TRIGGER (2026-08-08): GHSA-g6cj-pr64-35w5 (HIGH) published 2026-08-03
    #    against the pinned cryptography and sat unseen for 3 days, because this
    #    workflow was push-only and nobody pushed to a quiet main. Closed by the
    #    daily `schedule:` at the top of this file — a quiet main is no longer an
    #    unexamined main.
    #
    # 2) THE SUBJECT (2026-08-10): the fix above armed a detector that was auditing
    #    an EMPTY environment. The old step ran the action with `local: true`, no
    #    install step, and no `inputs:` — so it audited the action's own venv
    #    (pip-audit's dependencies), never this repo's. Every green it ever
    #    produced was vacuous, and the advisory in (1) would not have fired even
    #    with the schedule. A gate can only refuse what it is given. Closed by
    #    auditing the hash-pinned requirement exports directly, and by the
    #    bite-check below: every run first proves pip-audit REDS on the exact pin
    #    this gate once missed, so a blind audit can never read as green again.
    #    (If the bite step ever passes, either the audit went blind again or the
    #    advisory DB dropped cryptography==49.0.0 — update the bite pin, don't
    #    delete the check. The quieter decay: if that pin is ever yanked from
    #    PyPI the bite reds for the wrong reason and proves nothing, while the
    #    real audit below still gates — on a bite red with no vuln table in its
    #    log, update the pin.)
    #
    # Honest bounds, unchanged: this gate DETECTS, it does not remediate
    # (Dependabot's auto-fix arm cannot open a mergeable PR here — see
    # .github/dependabot.yml for the three reasons, so the fix is a human moving
    # both bounds and relocking), and it speaks for this repo's own pinned resolve
    # (the runtime + dev exports), not for whatever an adopter's resolver picks
    # inside our published ranges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Stage the bite-check pin (the CVE this gate once missed)
        run: printf 'cryptography==49.0.0\n' > "$RUNNER_TEMP/bite-check.txt"
      - name: Bite check — pip-audit must red on a known-vulnerable pin
        id: bite
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: ${{ runner.temp }}/bite-check.txt
          no-deps: true
          summary: false
      - name: Refuse a blind detector
        if: steps.bite.outcome != 'failure'
        run: |
          echo "::error::pip-audit passed cryptography==49.0.0 — the detector is blind (or the advisory moved); do not trust the audit below"
          exit 1
      - name: Audit the pinned dependency exports for known CVEs
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements/runtime.txt requirements/dev.txt
          require-hashes: true
          no-deps: true

  # GitHub disables `schedule:` triggers on a PUBLIC repo after 60 days of repo inactivity — and a
  # quiet repo is exactly when the security net matters, since a solo project's default state IS
  # quiet. Left alone, the whole cron-driven net (this daily CVE gate, the daily ref-audit, the
  # nightly gitleaks history scan, weekly codeql/trivy/scorecard) evaporates silently. This job is
  # the keepalive: daily, it re-enables every workflow that carries a `schedule:` trigger. The list
  # is DISCOVERED from the checkout (`grep -l schedule:`), not hand-maintained — a new scheduled
  # workflow is covered the day it lands, with nothing to remember to update.
  #
  # Honest bound, stated so nobody over-trusts it: the keepalive heals the OTHER workflows, but
  # nothing heals the keepalive. If ci.yml's own schedule is the one that lapses, the net is down
  # until the next push re-arms it. That residual is irreducible from inside Actions; the external
  # freshness check (a monitor asserting "last scheduled CI run < 48h old") is where it closes, and
  # that lives outside this repo.
  keepalive:
    runs-on: ubuntu-latest
    # Only the scheduled/manual fire needs to re-arm; skip it on ordinary push/PR (a push already
    # re-arms schedules, and PRs from forks get no token for this).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: write   # enable-workflow on this repo's own Actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Re-enable every scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rc=0
          for f in $(grep -lE '^[[:space:]]*schedule:' .github/workflows/*.yml); do
            wf=$(basename "$f")
            # enable is idempotent — a HTTP 204 whether it was disabled or already active.
            if gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" >/dev/null 2>&1; then
              echo "re-enabled (or already active): $wf"
            else
              echo "::warning::could not enable $wf — it may be new/unregistered this run"
              rc=1
            fi
          done
          exit "$rc"

  # Every public ref must stay curated. This repo's public main is a curated
  # fast-forward tree; its safety rests on ONE invariant — no public ref points
  # into the internal line. Tag v0.24.0 broke it silently (a July `--tags`
  # accident) and exposed 592 uncurated commits for ~3 weeks; every per-push
  # gate was blind because a tag pushed once is in no future diff, ever. Found
  # 2026-08-09 by the first scheduled full-history scan — by luck, via fixture
  # false-positives that happened to live in the leaked history. This job is
  # that detection made deliberate: it walks EVERY branch and tag daily and
  # reds if any strays off main or carries an internal-only path OR a leak shape
  # in its changed contents. The local pre-push guard blocks the same class at
  # the muzzle; this is the net if anything ever gets past it.
  #
  # The content scan (not just path names) and the denied-path decision both come
  # from release_leak_audit.py's constants via its `ref-scan` subcommand — the ci
  # side no longer hand-copies the deny regex, which drifted from the Python source
  # every time one was edited without the other. Honest bound: the PUBLIC checkout
  # has no `.gitea/*deny.txt` files (they are stripped from the mirror), so off-main
  # scanning here is shape-only — a degrade from the internal gate that also carries
  # the site-literal and competitor denylists, not a gap in the shape coverage.
  ref-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # all branches + tags — standing refs are the audit surface
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Every public ref is an ancestor of main, or tiny and clean
        run: |
          set -euo pipefail
          main=$(git rev-parse origin/main)
          fail=0
          refs=0
          offmain=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags \
                       | grep -v '^refs/remotes/origin/HEAD$'); do
            refs=$((refs + 1))
            tip=$(git rev-parse "$ref^{commit}")
            n=$(git rev-list --count "$main..$tip")
            [ "$n" -eq 0 ] && continue
            offmain=$((offmain + n))
            # The only legitimate off-main refs are short-lived PR branches
            # (dependabot: main + a commit or two). Hundreds off-main = an
            # uncurated history is reachable, exactly the v0.24.0 shape.
            if [ "$n" -gt 25 ]; then
              echo "::error::$ref exposes $n commits not on main — uncurated history reachable"
              fail=1
              continue
            fi
            for c in $(git rev-list "$main..$tip"); do
              # Denied internal-only PATH present, or a leak SHAPE in the changed
              # contents, either reds — decided by the release audit's own rules.
              python scripts/release_leak_audit.py ref-scan "$c" "$main" || fail=1
            done
          done
          tags=$(git for-each-ref --format='%(refname)' refs/tags | wc -l)
          echo "audited $refs public ref(s), $tags of them tags; $offmain commit(s) reachable off main"
          # A silent pass over an empty ref list reads EXACTLY like a clean audit: same
          # line, same exit 0. What leaked in July was a TAG, so a run that fetched no
          # tags proves nothing and must not be allowed to report a clean surface.
          if [ "$refs" -lt 2 ] || [ "$tags" -lt 1 ]; then
            echo "::error::ref-audit saw $refs ref(s) and $tags tag(s) — the ref list is empty or unfetched, so this scan proves nothing"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "every public ref is curated: on main, or ≤25 clean commits ahead"
          exit "$fail"
