name: CI

on:
  push:
    branches: [main]
  pull_request:
  # DAILY, and this is the gate's whole point rather than a nicety. The pip-audit job below is
  # a BLOCKING dependency-CVE gate, but a blocking gate only blocks when it RUNS, and until
  # this trigger existed CI ran on push alone. GHSA-g6cj-pr64-35w5 (HIGH, CVSS 8.2) published
  # 2026-08-03 against the pinned cryptography and this repo did not notice for three days,
  # because nothing pushed to main between 08-02 and 08-06 — it was caught by a human reading
  # the advisory feed, not by us. A quiet main was an unexamined main, and "we scan
  # dependencies" read as a continuous promise while being a per-push one.
  #
  # Daily rather than the weekly cadence codeql/trivy/scorecard use: those watch a base image
  # and source that change slowly, while a dependency CVE is disclosed against code we have
  # ALREADY shipped and pinned. Weekly would have left that same advisory sitting up to seven
  # days. Slot picked clear of the other three (03:27 / 04:41 / 05:23 Monday).
  #
  # It re-runs the whole suite, not just the audit, and that is deliberate: a scheduled run is
  # also the only thing that catches a test which rots without a commit behind it (see the
  # pacioli close-window fixtures, which expired on a calendar boundary and went red on an
  # innocent release commit a week later).
  schedule:
    - cron: "13 6 * * *"   # daily, 06:13 UTC
  # Manual re-run, and it is not decoration. v0.31.1 landed on main during a GitHub Actions
  # outage (incident opened 2026-08-06T15:22Z, impact critical), so no CI run was ever created
  # for that commit — GitHub does not backfill runs for a push its fleet missed. With push as
  # the only trigger there is NO way to verify such a commit here afterwards: the gap closes
  # only if some later, unrelated push happens to cover it. trivy.yml already carries this
  # trigger for the same reason. Dispatch against the ref you need (a release tag works).
  workflow_dispatch:

# Explicit read-only floor (fork PRs already get this, but be unambiguous).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-pinned lockfiles; the project itself --no-deps)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -ra

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check version consistency (pyproject == __init__ == CHANGELOG == server.json)
        run: python scripts/version_tools.py check   # stdlib only, no install needed

  # requirements/*.txt are exports of uv.lock, and the `test` job installs them with pip,
  # so uv is absent there and the drift guard in tests/test_requirements_lock.py skips —
  # exactly where a stale export does its damage. That skip is why pyasn1 sat two days at
  # 0.6.3 in dev.txt while the lock already said 0.6.4 (alerts #3/#4). This job is the
  # environment where the guard cannot skip.
  requirements-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check requirements/*.txt still match uv.lock
        run: uv run --no-project --with pytest pytest tests/test_requirements_lock.py -q -ra

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so gitleaks scans commits, not just the tree
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        # Free for individual accounts — no GITLEAKS_LICENSE needed. GITHUB_TOKEN is
        # required to scan pull requests (gitleaks-action v2 breaking change).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    # Blocking gate: a new CVE in a dependency reds CI until it's patched.
    #
    # This comment used to assert "the dependency baseline is clean (verified 2026-06-24)".
    # That claim went stale and then went false: GHSA-g6cj-pr64-35w5 (HIGH) published
    # 2026-08-03 against the pinned cryptography, and this job did not catch it — because
    # a blocking gate only blocks when it RUNS, and nothing had pushed to main since
    # 08-02. It was found by reading the advisory feed, not by CI.
    #
    # CLOSED 2026-08-08 by the daily `schedule:` trigger at the top of this file. The
    # miss was never pip-audit's detection, it was the trigger: a quiet main was an
    # unexamined main. This job now runs every day whether or not anyone pushed, so a
    # CVE disclosed against already-shipped pins reds CI on the next morning's run
    # instead of waiting for unrelated activity.
    #
    # Still no standing claim about the baseline lives here, and the honest bound is
    # unchanged in two places. (1) This gate DETECTS; it does not remediate. Dependabot's
    # auto-fix arm cannot open a mergeable PR for this repo (see .github/dependabot.yml
    # for the three reasons), so the fix is a human moving both bounds and relocking.
    # (2) It audits what is PINNED here, so it speaks for this repo's own resolve, not
    # for whatever an adopter's resolver picks inside our published ranges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit dependencies for known CVEs
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          local: true

  # Every public ref must stay curated. This repo's public main is a curated
  # fast-forward tree; its safety rests on ONE invariant — no public ref points
  # into the internal line. Tag v0.24.0 broke it silently (a July `--tags`
  # accident) and exposed 592 uncurated commits for ~3 weeks; every per-push
  # gate was blind because a tag pushed once is in no future diff, ever. Found
  # 2026-08-09 by the first scheduled full-history scan — by luck, via fixture
  # false-positives that happened to live in the leaked history. This job is
  # that detection made deliberate: it walks EVERY branch and tag daily and
  # reds if any strays off main or carries an internal-only path. The local
  # pre-push guard blocks the same class at the muzzle; this is the net if
  # anything ever gets past it.
  ref-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # all branches + tags — standing refs are the audit surface
      - name: Every public ref is an ancestor of main, or tiny and clean
        run: |
          set -euo pipefail
          main=$(git rev-parse origin/main)
          deny='^(\.gitea/|docs/plans/|docs/specs/|docs/internal/)|(^|/)(CLAUDE|POSITIONING|LANDSCAPE|ROADMAP|CEILING|LAB)\.md$'
          fail=0
          refs=0
          offmain=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags \
                       | grep -v '^refs/remotes/origin/HEAD$'); do
            refs=$((refs + 1))
            tip=$(git rev-parse "$ref^{commit}")
            n=$(git rev-list --count "$main..$tip")
            [ "$n" -eq 0 ] && continue
            offmain=$((offmain + n))
            # The only legitimate off-main refs are short-lived PR branches
            # (dependabot: main + a commit or two). Hundreds off-main = an
            # uncurated history is reachable, exactly the v0.24.0 shape.
            if [ "$n" -gt 25 ]; then
              echo "::error::$ref exposes $n commits not on main — uncurated history reachable"
              fail=1
              continue
            fi
            for c in $(git rev-list "$main..$tip"); do
              hits=$(git ls-tree -r "$c" --name-only | grep -cE "$deny" || true)
              if [ "$hits" -gt 0 ]; then
                echo "::error::$ref commit $c carries $hits internal-only path(s)"
                fail=1
              fi
            done
          done
          tags=$(git for-each-ref --format='%(refname)' refs/tags | wc -l)
          echo "audited $refs public ref(s), $tags of them tags; $offmain commit(s) reachable off main"
          # A silent pass over an empty ref list reads EXACTLY like a clean audit: same
          # line, same exit 0. What leaked in July was a TAG, so a run that fetched no
          # tags proves nothing and must not be allowed to report a clean surface.
          if [ "$refs" -lt 2 ] || [ "$tags" -lt 1 ]; then
            echo "::error::ref-audit saw $refs ref(s) and $tags tag(s) — the ref list is empty or unfetched, so this scan proves nothing"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "every public ref is curated: on main, or ≤25 clean commits ahead"
          exit "$fail"
