name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, and it is not decoration. v0.31.1 landed on main during a GitHub Actions
  # outage (incident opened 2026-08-06T15:22Z, impact critical), so no CI run was ever created
  # for that commit — GitHub does not backfill runs for a push its fleet missed. With push as
  # the only trigger there is NO way to verify such a commit here afterwards: the gap closes
  # only if some later, unrelated push happens to cover it. trivy.yml already carries this
  # trigger for the same reason. Dispatch against the ref you need (a release tag works).
  workflow_dispatch:

# Explicit read-only floor (fork PRs already get this, but be unambiguous).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-pinned lockfiles; the project itself --no-deps)
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -ra

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check version consistency (pyproject == __init__ == CHANGELOG == server.json)
        run: python scripts/version_tools.py check   # stdlib only, no install needed

  # requirements/*.txt are exports of uv.lock, and the `test` job installs them with pip,
  # so uv is absent there and the drift guard in tests/test_requirements_lock.py skips —
  # exactly where a stale export does its damage. That skip is why pyasn1 sat two days at
  # 0.6.3 in dev.txt while the lock already said 0.6.4 (alerts #3/#4). This job is the
  # environment where the guard cannot skip.
  requirements-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check requirements/*.txt still match uv.lock
        run: uv run --no-project --with pytest pytest tests/test_requirements_lock.py -q -ra

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so gitleaks scans commits, not just the tree
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        # Free for individual accounts — no GITLEAKS_LICENSE needed. GITHUB_TOKEN is
        # required to scan pull requests (gitleaks-action v2 breaking change).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    # Blocking gate: a new CVE in a dependency reds CI until it's patched.
    #
    # This comment used to assert "the dependency baseline is clean (verified 2026-06-24)".
    # That claim went stale and then went false: GHSA-g6cj-pr64-35w5 (HIGH) published
    # 2026-08-03 against the pinned cryptography, and this job did not catch it — because
    # a blocking gate only blocks when it RUNS, and nothing had pushed to main since
    # 08-02. It was found by reading the advisory feed, not by CI.
    #
    # So: no standing claim about the baseline lives here. The gate's guarantee is
    # narrower than it reads — it covers whatever was pushed, when it was pushed, and a
    # quiet main means an unexamined main.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit dependencies for known CVEs
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          local: true
