name: OpenSSF Scorecard

# Supply-chain posture scoring: branch protection, pinned dependencies, token
# permissions, dangerous workflow patterns, SAST coverage, and more. Publishes the
# score to the public OpenSSF Scorecard dashboard (powers the badge). It deliberately
# does NOT upload findings to the GitHub Security tab — those are posture
# *recommendations*, not vulnerabilities, and several (Contributors, Fuzzing,
# Code-Review) don't apply to a solo-maintained project. The Security tab stays
# focused on actual vulnerabilities (CodeQL + Trivy). Informational —
# it scores the repo's practices; it does not gate the build.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"   # weekly, Monday 05:23 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # publish results to the public Scorecard API (the badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true   # -> OpenSSF dashboard/badge; NOT uploaded to the Security tab
