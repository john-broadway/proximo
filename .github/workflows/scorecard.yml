name: OpenSSF Scorecard

# Supply-chain posture scoring: branch protection, pinned dependencies, token
# permissions, dangerous workflow patterns, SAST coverage, and more. Publishes the
# score to the public OpenSSF Scorecard dashboard (powers the badge). It deliberately
# does NOT upload findings to the GitHub Security tab — those are posture
# *recommendations*, not vulnerabilities, and several (Contributors, Fuzzing,
# Code-Review) don't apply to a solo-maintained project. The Security tab stays
# focused on actual vulnerabilities (CodeQL + Trivy). Informational —
# it scores the repo's practices; it does not gate the build.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1"   # weekly, Monday 05:23 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # publish results to the public Scorecard API (the badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true   # -> OpenSSF dashboard/badge; NOT uploaded to the Security tab

  # OpenSSF verifies this workflow before it takes a result, and the job that runs the action may
  # hold no `run:` step: with one, the publish is refused ("scorecard job must only have steps with
  # `uses`", a 400). This check sat in that job from 2026-11-06 and, the first time it reached
  # GitHub (0.53.0), was itself why nothing published. It keeps its purpose in a job of its own.
  #
  # The action logs a failed publish ("error sending scorecard results to webapp: http response
  # 500", or the 400 above) and still exits 0, so a green run said nothing about the badge
  # (2026-11-06: the badge went to "invalid repo path" behind a green check). Ask the public API
  # for THIS commit; a result for another commit, or none, after the retries is a red run.
  # The action's own knob for a refused publish (`fail_on_publish_error`, with `results_published`
  # read from a separate job) is documented for v2.6.0; the latest release is v2.5.0 (read
  # 2026-11-16). When it ships, the vendor's word replaces this poll for a rejection.
  published:
    needs: analysis
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the score was published
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          url="https://api.scorecard.dev/projects/github.com/${REPO}"
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS --max-time 20 "$url" | jq -r '.repo.commit // empty' || true)
            if [ "$got" = "$SHA" ]; then echo "published: $SHA"; exit 0; fi
            echo "try $i: the API holds '${got:-nothing}', want $SHA"; sleep 30
          done
          echo "::error::the Scorecard API never showed this commit's result: the publish failed (see the analysis job)"
          exit 1
